name: LG webOS main
on:
  push:
    branches: [main]
    paths: ['ss-display-webos/**', '.github/workflows/webos-main.yml']
permissions:
  contents: read
concurrency:
  group: webos-main-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ss-display-webos } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: ss-display-webos/package-lock.json }
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with: { name: 'ss-display-webos-unsigned-${{ github.sha }}', path: ss-display-webos/dist, if-no-files-found: error }
